<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Weather Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet.js Interactive Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-950 min-h-screen text-white flex items-center justify-center p-4">

    <div class="w-full max-w-xl bg-white/15 backdrop-blur-xl border border-white/20 rounded-3xl p-6 shadow-2xl my-6">
        
        <!-- Search & Unit Toggle Header -->
        <div class="flex gap-2 mb-6 items-center">
            <input type="text" id="cityInput" placeholder="Search city..." class="flex-1 bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-purple-400">
            <button onclick="getWeather()" class="bg-purple-600 hover:bg-purple-500 px-5 py-3 rounded-xl font-semibold transition cursor-pointer">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button onclick="toggleUnits()" id="unitToggleBtn" class="bg-white/10 hover:bg-white/20 border border-white/20 px-4 py-3 rounded-xl font-bold text-sm transition cursor-pointer" title="Switch Temperature Unit">
                °C
            </button>
        </div>

        <!-- Weather Result Container -->
        <div id="weatherResult" class="hidden space-y-6">
            
            <!-- Main Header Info -->
            <div class="text-center">
                <h2 id="cityName" class="text-3xl font-bold mb-1"></h2>
                <p id="weatherDesc" class="text-purple-200 capitalize text-sm"></p>
                
                <div class="flex items-center justify-center gap-4 my-4">
                    <div id="weatherIconContainer" class="text-6xl text-amber-300">
                        <i id="weatherIcon" class="fa-solid fa-sun"></i>
                    </div>
                    <div class="text-6xl font-extrabold" id="temp">--</div>
                </div>
            </div>

            <!-- Extended Metrics Grid -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center text-center">
                    <i class="fa-solid fa-droplet text-blue-400 text-lg mb-1"></i>
                    <p class="text-[10px] text-purple-300 uppercase tracking-wider">Humidity</p>
                    <p id="humidity" class="font-semibold text-sm">--%</p>
                </div>
                <div class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center text-center">
                    <i class="fa-solid fa-wind text-teal-400 text-lg mb-1"></i>
                    <p class="text-[10px] text-purple-300 uppercase tracking-wider">Wind Speed</p>
                    <p id="wind" class="font-semibold text-sm">-- km/h</p>
                </div>
                <div class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center text-center">
                    <i class="fa-solid fa-temperature-three-quarters text-amber-400 text-lg mb-1"></i>
                    <p class="text-[10px] text-purple-300 uppercase tracking-wider">Feels Like</p>
                    <p id="feelsLike" class="font-semibold text-sm">--</p>
                </div>
                <div class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center text-center">
                    <i class="fa-solid fa-sun text-yellow-300 text-lg mb-1"></i>
                    <p class="text-[10px] text-purple-300 uppercase tracking-wider">UV Index</p>
                    <p id="uvIndex" class="font-semibold text-sm">--</p>
                </div>
                <div class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center text-center">
                    <i class="fa-solid fa-gauge text-indigo-300 text-lg mb-1"></i>
                    <p class="text-[10px] text-purple-300 uppercase tracking-wider">Pressure</p>
                    <p id="pressure" class="font-semibold text-sm">-- hPa</p>
                </div>
                <div class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center text-center">
                    <i class="fa-solid fa-clock text-purple-300 text-lg mb-1"></i>
                    <p class="text-[10px] text-purple-300 uppercase tracking-wider">Sunrise / Sunset</p>
                    <p id="sunTimes" class="font-semibold text-[11px]">--</p>
                </div>
            </div>

            <!-- 24-Hour Analytics Chart -->
            <div class="bg-white/5 border border-white/10 p-4 rounded-2xl">
                <h3 class="text-xs font-semibold text-purple-200 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-chart-line"></i> 24-Hour Temperature & Rainfall Trend
                </h3>
                <div class="h-48 w-full">
                    <canvas id="weatherChart"></canvas>
                </div>
            </div>

            <!-- Interactive Map -->
            <div class="bg-white/5 border border-white/10 p-4 rounded-2xl">
                <h3 class="text-xs font-semibold text-purple-200 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-map-location-dot"></i> Interactive Location Map
                </h3>
                <div id="map" class="h-48 rounded-xl z-0 border border-white/10"></div>
            </div>

            <!-- 3-Day Forecast Section -->
            <div class="pt-2 border-t border-white/10">
                <h3 class="text-xs font-semibold text-purple-200 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days"></i> 3-Day Forecast
                </h3>
                <div id="forecastContainer" class="grid grid-cols-3 gap-2"></div>
            </div>
        </div>

        <!-- Error Message -->
        <p id="errorMsg" class="text-red-300 text-center hidden mt-4">Location not found. Please verify the spelling.</p>
    </div>

    <!-- Script Dependencies -->
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
