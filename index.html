<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Weather App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-950 min-h-screen text-white flex items-center justify-center p-4">

    <div class="w-full max-w-lg bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-6 shadow-2xl">
        <!-- Search Bar -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="cityInput" placeholder="Enter city name..." class="flex-1 bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-purple-400">
            <button onclick="getWeather()" class="bg-purple-600 hover:bg-purple-500 px-5 rounded-xl font-semibold transition cursor-pointer">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <!-- Weather Result Card -->
        <div id="weatherResult" class="text-center hidden">
            <h2 id="cityName" class="text-3xl font-bold mb-1"></h2>
            <p id="weatherDesc" class="text-purple-200 capitalize mb-2 text-sm"></p>
            
            <!-- Main Temperature & Icon -->
            <div class="flex items-center justify-center gap-4 my-4">
                <div id="weatherIconContainer" class="text-6xl text-amber-300">
                    <i id="weatherIcon" class="fa-solid fa-sun"></i>
                </div>
                <div class="text-6xl font-extrabold" id="temp">--°C</div>
            </div>

            <!-- Weather Details Grid -->
            <div class="grid grid-cols-3 gap-3 mt-6">
                <div class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center">
                    <i class="fa-solid fa-droplet text-blue-400 text-xl mb-1"></i>
                    <p class="text-[10px] text-purple-300 uppercase tracking-wider">Humidity</p>
                    <p id="humidity" class="font-semibold text-sm">--%</p>
                </div>
                <div class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center">
                    <i class="fa-solid fa-wind text-teal-400 text-xl mb-1"></i>
                    <p class="text-[10px] text-purple-300 uppercase tracking-wider">Wind</p>
                    <p id="wind" class="font-semibold text-sm">-- km/h</p>
                </div>
                <div class="bg-white/5 border border-white/10 p-3 rounded-2xl flex flex-col items-center justify-center">
                    <i class="fa-solid fa-temperature-three-quarters text-amber-400 text-xl mb-1"></i>
                    <p class="text-[10px] text-purple-300 uppercase tracking-wider">Feels Like</p>
                    <p id="feelsLike" class="font-semibold text-sm">--°C</p>
                </div>
            </div>

            <!-- 3-Day Forecast Section -->
            <div class="mt-6 pt-4 border-t border-white/10">
                <h3 class="text-left text-sm font-semibold text-purple-200 mb-3"><i class="fa-solid fa-calendar-days mr-2"></i>3-Day Forecast</h3>
                <div id="forecastContainer" class="grid grid-cols-3 gap-2">
                    <!-- Dynamic forecast cards go here -->
                </div>
            </div>
        </div>

        <!-- Error Message -->
        <p id="errorMsg" class="text-red-300 text-center hidden mt-4">City not found. Try again!</p>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
